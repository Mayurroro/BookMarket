<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Secure Checkout | BookMarket</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container": "#edeeef",
              "tertiary-fixed": "#ffdbcc",
              "surface-container-lowest": "#ffffff",
              "on-tertiary": "#ffffff",
              "secondary-fixed": "#dfe3e8",
              "on-secondary-fixed-variant": "#43474c",
              "tertiary-fixed-dim": "#e8bdaa",
              "on-tertiary-fixed-variant": "#5e4032",
              "on-primary": "#ffffff",
              "outline-variant": "#c1c8c7",
              "secondary-fixed-dim": "#c3c7cc",
              "on-error-container": "#93000a",
              "secondary-container": "#dde0e6",
              "secondary": "#5b5f64",
              "on-tertiary-fixed": "#2d160a",
              "primary-container": "#1a3636",
              "tertiary": "#2e170b",
              "on-primary-fixed-variant": "#304b4b",
              "surface-container-highest": "#e1e3e4",
              "primary-fixed": "#cae8e8",
              "inverse-primary": "#aecccc",
              "on-secondary-fixed": "#181c20",
              "on-tertiary-container": "#b89180",
              "surface-variant": "#e1e3e4",
              "surface": "#f8f9fa",
              "on-primary-container": "#829f9f",
              "on-error": "#ffffff",
              "inverse-surface": "#2e3132",
              "surface-bright": "#f8f9fa",
              "primary": "#032121",
              "surface-dim": "#d9dadb",
              "on-background": "#191c1d",
              "inverse-on-surface": "#f0f1f2",
              "surface-tint": "#476363",
              "error": "#ba1a1a",
              "background": "#f8f9fa",
              "primary-fixed-dim": "#aecccc",
              "on-surface": "#191c1d",
              "on-secondary": "#ffffff",
              "on-primary-fixed": "#022020",
              "outline": "#727878",
              "on-surface-variant": "#414848",
              "surface-container-low": "#f3f4f5",
              "surface-container-high": "#e7e8e9",
              "error-container": "#ffdad6",
              "on-secondary-container": "#5f6368",
              "tertiary-container": "#462b1e"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-premium-gradient {
            background: linear-gradient(135deg, #032121 0%, #1a3636 100%);
        }
        .active-ring {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #032121;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center p-6">
<!-- Main Checkout Card -->
<main class="w-full max-w-[500px] bg-surface-container-lowest rounded-2xl shadow-[0_32px_64px_-12px_rgba(3,33,33,0.08)] overflow-hidden flex flex-col">
<!-- Order Summary Section -->
<section class="p-8 bg-surface-container-low/50 backdrop-blur-sm">
<div class="flex items-center justify-between mb-6">
<h1 class="font-headline text-2xl font-extrabold tracking-tight text-primary">Secure Checkout</h1>
<div class="flex items-center gap-1.5 px-3 py-1 bg-primary/5 rounded-full">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label text-[11px] font-bold uppercase tracking-wider text-primary">Secured</span>
</div>
</div>
<div class="space-y-4">
<div class="flex justify-between items-center">
<span class="text-on-surface-variant font-medium">The Midnight Library</span>
<span class="font-headline font-semibold text-on-surface">Rs.350</span>
</div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant font-medium">Shipping</span>
<span class="font-headline font-semibold text-on-surface">Rs.200</span>
</div>
<div class="pt-4 mt-4 border-t border-outline-variant/30 flex justify-between items-center">
<span class="text-on-surface font-bold text-lg">Total</span>
<span class="font-headline font-extrabold text-2xl text-primary">Rs.550</span>
</div>
</div>
</section>
<!-- Payment Details Form -->
<section class="p-8 space-y-8">
<!-- Payment Method Selector -->
<div>
<label class="font-headline text-sm font-bold text-on-surface-variant mb-4 block">Select Payment Method</label>
<div class="grid grid-cols-3 gap-3">
<!-- Credit Card (Active) -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-lowest border-2 border-primary active:scale-95 transition-all group">
<span class="material-symbols-outlined text-primary mb-2 group-hover:scale-110 transition-transform" data-icon="credit_card" style="font-variation-settings: 'FILL' 1;">credit_card</span>
<span class="font-label text-[10px] font-bold text-primary uppercase tracking-tight text-center">Card</span>
</button>
<!-- UPI -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-low border-2 border-transparent hover:bg-surface-container-high active:scale-95 transition-all group">
<span class="material-symbols-outlined text-on-surface-variant mb-2 group-hover:scale-110 transition-transform" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label text-[10px] font-bold text-on-surface-variant uppercase tracking-tight text-center">UPI</span>
</button>
<!-- Net Banking -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-low border-2 border-transparent hover:bg-surface-container-high active:scale-95 transition-all group">
<span class="material-symbols-outlined text-on-surface-variant mb-2 group-hover:scale-110 transition-transform" data-icon="account_balance">account_balance</span>
<span class="font-label text-[10px] font-bold text-on-surface-variant uppercase tracking-tight text-center">Banking</span>
</button>
</div>
</div>
<!-- Card Input Fields -->
<div class="space-y-5">
<div class="space-y-2">
<label class="font-headline text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1" for="card-name">Cardholder Name</label>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" id="card-name" placeholder="Johnathan Doe" type="text"/>
</div>
<div class="space-y-2">
<label class="font-headline text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1" for="card-number">Card Number</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" id="card-number" placeholder="0000 0000 0000 0000" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-2">
<span class="material-symbols-outlined text-outline" data-icon="credit_card">credit_card</span>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-headline text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1" for="expiry">Expiry</label>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" id="expiry" placeholder="MM/YY" type="text"/>
</div>
<div class="space-y-2">
<label class="font-headline text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1" for="cvv">CVV</label>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" id="cvv" placeholder="•••" type="password"/>
</div>
</div>
<!-- UPI Input (Hidden by default in actual logic, shown here as requested for styling) -->
<div class="space-y-2 pt-2">
<label class="font-headline text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1" for="upi-id">UPI ID</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all border border-primary/10" id="upi-id" placeholder="username@bank" type="text"/>
</div>
</div>
</div>
<!-- Pay Button -->
<button class="w-full bg-premium-gradient text-on-primary font-headline font-bold py-5 rounded-xl shadow-xl shadow-primary/20 active:scale-[0.98] hover:opacity-90 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                Pay Rs.550
            </button>
<!-- Trust Badges -->
<div class="flex items-center justify-center gap-6 pt-2">
<div class="flex items-center gap-1.5 grayscale opacity-40 hover:grayscale-0 hover:opacity-100 transition-all cursor-default">
<span class="material-symbols-outlined text-[20px]" data-icon="shield">shield</span>
<span class="font-label text-[10px] font-bold uppercase tracking-tighter">PCI Compliant</span>
</div>
<div class="flex items-center gap-1.5 grayscale opacity-40 hover:grayscale-0 hover:opacity-100 transition-all cursor-default">
<span class="material-symbols-outlined text-[20px]" data-icon="encrypted">encrypted</span>
<span class="font-label text-[10px] font-bold uppercase tracking-tighter">SSL Secure</span>
</div>
</div>
</section>
</main>
<!-- Decorative Elements (The "Floating Grid" effect) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[30%] h-[30%] bg-tertiary-container/10 rounded-full blur-[100px]"></div>
</div>
</body></html>
