<script src="/static/js/app.js"></script>
<script>
(function () {
  var PLACEHOLDER_IMG =
    "data:image/svg+xml," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect fill="#e7e8e9" width="100%" height="100%"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#727878" font-family="system-ui,sans-serif" font-size="14">No image</text></svg>'
    );

  function escapeHtml(text) {
    if (text == null) return "";
    var div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function escapeAttr(text) {
    if (text == null) return "";
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;");
  }

  function createBrowseBookCard(book) {
    var article = document.createElement("article");
    article.className =
      "group relative flex flex-col bg-surface-container-lowest rounded-xl overflow-hidden transition-all duration-300 book-card-hover";

    var imgSrc = book.image_url ? String(book.image_url) : PLACEHOLDER_IMG;
    var discountPct =
      book.original_price != null &&
      book.original_price > book.price
        ? Math.round((1 - book.price / book.original_price) * 100)
        : 0;
    var showDiscount = discountPct > 0;

    var categoryHtml = book.category
      ? '<span class="px-2 py-0.5 bg-primary-container text-on-primary-container rounded-md text-[10px] font-bold uppercase tracking-widest">' +
        escapeHtml(book.category) +
        "</span>"
      : "";

    var originalHtml =
      book.original_price != null
        ? '<span class="text-sm text-outline line-through">₹' +
          Number(book.original_price).toFixed(2) +
          "</span>"
        : "";

    var descHtml = book.description ? escapeHtml(book.description) : "";

    var viewBtn = !book.is_sold
      ? '<button type="button" class="px-6 py-2.5 bg-on-primary text-primary font-bold rounded-lg transform translate-y-4 group-hover:translate-y-0 transition-transform" onclick="buyBook(' +
        book.id +
        ')">View Details</button>'
      : '<button type="button" class="px-6 py-2.5 bg-on-primary/50 text-primary font-bold rounded-lg transform translate-y-4 group-hover:translate-y-0 transition-transform cursor-not-allowed" disabled>Sold Out</button>';

    article.innerHTML =
      '<div class="relative aspect-[3/4] overflow-hidden bg-surface-container-low">' +
      '<img alt="' +
      escapeAttr(book.title) +
      '" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" data-alt="' +
      escapeAttr(book.description || book.title) +
      '" src="' +
      escapeAttr(imgSrc) +
      '"/>' +
      (showDiscount
        ? '<div class="absolute top-3 left-3 bg-error text-on-error px-2.5 py-1 rounded-md text-xs font-bold tracking-wider">' +
          discountPct +
          "% OFF</div>"
        : "") +
      '<div class="absolute inset-0 bg-primary/0 group-hover:bg-primary/40 transition-colors flex items-center justify-center opacity-0 group-hover:opacity-100 duration-300">' +
      viewBtn +
      "</div>" +
      "</div>" +
      '<div class="p-5 flex flex-col flex-1">' +
      '<div class="flex items-center gap-2 mb-3">' +
      categoryHtml +
      '<span class="px-2 py-0.5 bg-secondary-container text-on-secondary-container rounded-md text-[10px] font-bold uppercase tracking-widest">' +
      escapeHtml(book.condition) +
      "</span>" +
      "</div>" +
      '<h3 class="text-xl font-headline font-bold text-on-surface line-clamp-1 mb-1">' +
      escapeHtml(book.title) +
      "</h3>" +
      '<p class="text-sm text-secondary font-medium mb-3">' +
      escapeHtml(book.author) +
      "</p>" +
      '<p class="text-sm text-on-surface-variant line-clamp-2 mb-4 leading-relaxed italic">' +
      descHtml +
      "</p>" +
      '<div class="mt-auto flex items-baseline gap-2">' +
      '<span class="text-xl font-headline font-extrabold text-primary">₹' +
      Number(book.price).toFixed(2) +
      "</span>" +
      originalHtml +
      "</div>" +
      "</div>";

    return article;
  }

  async function loadBrowseBooks() {
    var container = document.getElementById("books-container");
    if (!container) return;
    container.innerHTML = "";
    try {
      var response = await fetch("/api/books");
      if (!response.ok) throw new Error("Failed to load books");
      var data = await response.json();
      console.log(data);
      if (!data.length) {
        container.innerHTML =
          '<p class="col-span-full text-center text-on-surface-variant py-12">No books available at the moment.</p>';
        return;
      }
      data.forEach(function (book) {
        container.appendChild(createBrowseBookCard(book));
      });
    } catch (e) {
      console.error(e);
      container.innerHTML =
        '<p class="col-span-full text-center text-on-surface-variant py-12">Could not load books.</p>';
    }
  }

  loadBrowseBooks();
})();
</script>
